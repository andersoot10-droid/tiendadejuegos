<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Compra</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #0f1115;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .confirmation-box {
            background-color: #1a1d24;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        p {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn-buy {
            background-color: #7000ff;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            flex: 1;
        }
        .btn-danger {
            background-color: #333;
            color: #ff4d4d;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            flex: 1;
        }
    </style>
</head>
<body>

    <main>
        <div class="confirmation-box">
            <h2>¿Estás seguro de realizar la compra?</h2>
            <p>Se cargará el importe a tu método de pago registrado.</p>

            <div class="button-group">
                <a href="exito.html" class="btn-buy">Sí, comprar</a>
                <a href="index.html" class="btn-danger">Cancelar</a>
            </div>
        </div>
    </main>

</body>
</html>
